spring:
  application:
    name: worker
  main:
    web-application-type: none      # garante que nenhum servidor web seja iniciado
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 1                 # cada worker pega 1 pergunta por vez (distribui melhor a carga)
        concurrency: 2              # 2 consumidores simultâneos...
        max-concurrency: 4          # ...podendo escalar até 4
        default-requeue-rejected: false   # evita loop infinito de mensagens com erro
  ai:
    model:
      embedding: none              # o tutor usa apenas chat
    retry:
      max-attempts: 1              # LlmService já controla as 3 tentativas
    openai:
      # Spring AI 1.0 acrescenta /v1/chat/completions à URL base.
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-120b}
          temperature: 0.4
          reasoning-effort: medium
          max-completion-tokens: ${GROQ_MAX_COMPLETION_TOKENS:4096}

app:
  llm:
    max-tentativas: 3
    espera-ms: 2000                 # intervalo entre tentativas (Retry)
