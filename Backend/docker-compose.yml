services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: devweb-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Painel web: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # persistência das filas/mensagens

volumes:
  rabbitmq_data:
